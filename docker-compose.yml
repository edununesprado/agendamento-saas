services:
  postgres:
    image: postgres:16
    container_name: agendamento-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agendamento

    ports:
      - "5432:5432"

    volumes:
      - agendamento_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agendamento"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agendamento_postgres_data: