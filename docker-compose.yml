services:
  postgres:
    image: postgres:16
    container_name: agendamento-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agendamento

    ports:
      - "5432:5432"

    volumes:
      - agendamento_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agendamento"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: agendamento-mailpit
    restart: unless-stopped

    ports:
      - "1025:1025"
      - "8025:8025"

    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db

      # Ambiente local de desenvolvimento.
      # Aceita qualquer usuário/senha SMTP.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

    volumes:
      - agendamento_mailpit_data:/data

volumes:
  agendamento_postgres_data:
  agendamento_mailpit_data: